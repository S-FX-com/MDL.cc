# MDL.cc - URL Shortening Service
# "The middle-point between you and your audience"

name = "mdl-cc"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"

# KV Namespace for fast URL lookups (primary speed optimization)
[[kv_namespaces]]
binding = "URL_KV"
id = "mdl_urls_kv"
preview_id = "mdl_urls_kv_preview"

# D1 Database for analytics, users, groups, and metadata
[[d1_databases]]
binding = "DB"
database_name = "mdl-db"
database_id = "mdl-database-id"

# Environment variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "MDL.cc"
APP_TAGLINE = "The middle-point between you and your audience"

# Development environment
[env.dev]
name = "mdl-cc-dev"
[env.dev.vars]
ENVIRONMENT = "development"

# Routes for the redirect worker (catches short URLs)
# [[routes]]
# pattern = "mdl.cc/*"
# zone_name = "mdl.cc"

# Static assets for the web app
[site]
bucket = "./web/dist"

# Build configuration
[build]
command = "npm run build:web"

# Observability
[observability]
enabled = true
