# MDL.cc - URL Shortening Service
# "The middle-point between you and your audience"

name = "mdl-cc"
account_id = "df01126c18116d8254d054785909a59e"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"

# KV Namespace for fast URL lookups (primary speed optimization)
[[kv_namespaces]]
binding = "URL_KV"
id = "2ab532525fdf4666ae06b7427bde1b02"

# D1 Database for analytics, users, groups, and metadata
[[d1_databases]]
binding = "DB"
database_name = "mdl-db"
database_id = "15d827a8-567e-4e2f-ad83-fff909e9b63c"

# Environment variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "MDL.cc"
APP_TAGLINE = "The middle-point between you and your audience"

# Cloudflare for SaaS (branded custom domains like go.s-fx.com).
# The zone id of mdl.cc (Cloudflare dashboard → mdl.cc → Overview → API → Zone ID).
# CF_API_TOKEN is a secret: `wrangler secret put CF_API_TOKEN`
# (token scoped to mdl.cc with SSL and Certificates: Edit + Zone Settings: Read).
CF_ZONE_ID = "d477042bacfb47ccf061525b6b2682b1"
CF_CNAME_TARGET = "cname.mdl.cc"

# Development environment
[env.dev]
name = "mdl-cc-dev"
[env.dev.vars]
ENVIRONMENT = "development"

# Routes for the redirect worker (catches short URLs)
# [[routes]]
# pattern = "mdl.cc/*"
# zone_name = "mdl.cc"

# Static assets for the web app
[assets]
binding = "ASSETS"
directory = "./web/dist"

# Build configuration
[build]
command = "npm run build:web"

# Observability
[observability]
enabled = true
